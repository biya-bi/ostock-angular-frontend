<ng-container *ngIf="context">
    <form *ngIf="formGroup" [formGroup]="formGroup"
        (ngSubmit)="manage.emit({entity:formGroup.value,operation:context.operation})">
        <h1 class="mb-4 d-flex justify-content-center" id="title" [ngSwitch]="context.operation">
            <ng-container *ngSwitchCase="Operation.Create">{{ 'organization.operations.add' |
                translate }}</ng-container>
            <ng-container *ngSwitchCase="Operation.Update">{{ 'organization.operations.edit' |
                translate }}</ng-container>
        </h1>
        <div class="container">
            <div class="row m-2">
                <div class="col text-end">
                    <label for="name" class="fw-bold">{{ 'organization.labels.name' |
                        translate }}</label>
                </div>
                <div class="col">
                    <input type="text" id="name" placeholder="{{'organization.attributes.name' | translate }}"
                        formControlName="name">
                </div>
            </div>
            <div class="row m-2">
                <div class="col text-end">
                    <label for="contactName" class="fw-bold">{{ 'organization.labels.contactName' |
                        translate }}</label>
                </div>
                <div class="col">
                    <input type="text" id="contactName"
                        placeholder="{{'organization.attributes.contactName' | translate }}"
                        formControlName="contactName">
                </div>
            </div>
            <div class="row m-2">
                <div class="col text-end">
                    <label for="contactEmail" class="fw-bold">{{ 'organization.labels.contactEmail' |
                        translate }}</label>
                </div>
                <div class="col">
                    <input type="email" id="contactEmail"
                        placeholder="{{'organization.attributes.contactEmail' | translate }}"
                        formControlName="contactEmail">
                </div>
            </div>
            <div class="row m-2">
                <div class="col text-end">
                    <label for="contactPhone" class="fw-bold">{{ 'organization.labels.contactPhone' |
                        translate }}</label>
                </div>
                <div class="col">
                    <input type="text" id="contactPhone"
                        placeholder="{{'organization.attributes.contactPhone' | translate }}"
                        formControlName="contactPhone">
                </div>
            </div>
        </div>
        <div class="mt-4 d-flex justify-content-center">
            <button type="submit" class="btn btn-primary" [disabled]="!formGroup.valid">{{ 'operations.save' | translate
                }}</button>
            <span class="m-2">|</span>
            <a routerLink="/organizations" class="btn btn-link ps-0">{{ 'operations.list' |
                translate }}</a>
        </div>
    </form>
    <div class="mt-4" ngbAccordion>
        <div *ngIf="formGroup.value?._links?.licenses?.href"
            (shown)="searchLicenses.emit({searchCriteria: context.licenseContext.searchCriteria, pageRequest: context.licenseContext.pagination.request, uri: formGroup.value._links.licenses.href})"
            ngbAccordionItem>
            <h2 ngbAccordionHeader>
                <button ngbAccordionButton>{{ 'general.licenses' | translate }}</button>
            </h2>
            <div ngbAccordionCollapse>
                <div ngbAccordionBody>
                    <app-license-list [enableManualContext]="true" [context]="context.licenseContext" [busy]="busy"
                        (manage)="writeLicense.emit($event)" (pageChange)="licensePageChange.emit($event)"
                        (search)="searchLicenses.emit($event)" />
                </div>
            </div>
        </div>
    </div>
</ng-container>
