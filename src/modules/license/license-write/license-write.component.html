<form *ngIf="context && formGroup" [formGroup]="formGroup"
	(ngSubmit)="formGroup.valid && manage.emit({entity:formGroup.value, operation:context.operation})">

	<h1 class="mb-4 d-flex justify-content-center" id="title" [ngSwitch]="context.operation">
		<ng-container *ngSwitchCase="Operation.Create">{{ 'license.operations.add' | translate
			}}</ng-container>
		<ng-container *ngSwitchCase="Operation.Update">{{ 'license.operations.edit' | translate
			}}</ng-container>
	</h1>

	<div class="col-lg-6 mx-auto">
		<div>
			<label for="productName" class="fw-bold form-label">{{ 'license.labels.productName' | translate
				}}</label>
			<input type="text" id="productName" placeholder="{{'license.attributes.productName' | translate }}"
				formControlName="productName" validationMessage class="form-control">
		</div>
		<div>
			<label for="description" class="fw-bold form-label">{{ 'license.labels.description' | translate
				}}</label>
			<input type="text" id="description" placeholder="{{'license.attributes.description' | translate }}"
				formControlName="description" class="form-control">
		</div>
		<div>
			<label for="comment" class="fw-bold form-label">{{ 'license.labels.comment' | translate
				}}</label>
			<input type="email" id="comment" placeholder="{{'license.attributes.comment' | translate }}"
				formControlName="comment" class="form-control">
		</div>
		<div>
			<label for="licenseType" class="fw-bold form-label">{{ 'license.labels.licenseType' | translate
				}}</label>
			<input type="text" id="licenseType" placeholder="{{'license.attributes.licenseType' | translate }}"
				formControlName="licenseType" validationMessage class="form-control">
		</div>
		<div>
			<label for="organization" class="fw-bold form-label">{{ 'license.labels.organization' | translate
				}}</label>
			<ng-select *ngIf="context.operation===Operation.Create"
				typeToSearchText="{{'data.prompts.typeToSearch' | translate }}" [items]="context.organizations"
				bindLabel="name" placeholder="{{'license.messages.selectOrganization' | translate }}"
				formControlName="organization" validationMessage
				validationFieldName="{{'license.attributes.organization' | translate }}" />

			<a *ngIf="context.selectedEntity?.organization && context.operation===Operation.Update"
				routerLink="/organizations/details"
				[queryParams]="{uri:context.selectedEntity.organization._links.self.href, operation:Operation.Read}">{{context.selectedEntity.organization.name
				}}
			</a>
		</div>
	</div>
	<div class="mt-4 d-flex justify-content-center">
		<button type="submit" class="btn btn-primary" [disabled]="!formGroup.valid">{{ 'operations.save' | translate
			}}</button>
		<span class="m-2">|</span>
		<a routerLink="/licenses" class="btn btn-link ps-0">{{ 'operations.list' | translate }}</a>
	</div>
</form>
