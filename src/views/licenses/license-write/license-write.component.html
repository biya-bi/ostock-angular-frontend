<div class="modal fade" id="writeLicenseModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="title" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="title">{{title}}</h1>
                <button #closeButton type="button" class="btn-close" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form *ngIf="formGroup" [formGroup]="formGroup">
                    <div class="container">
                        <div class="row m-2">
                            <div class="col text-end">
                                <label for="productName" class="fw-bold" i18n>Product name:</label>
                            </div>
                            <div class="col">
                                <input type="text" id="productName" placeholder="Product name"
                                    formControlName="productName" i18n-placeholder>
                            </div>
                        </div>
                        <div class="row m-2">
                            <div class="col text-end">
                                <label for="description" class="fw-bold" i18n>Description:</label>
                            </div>
                            <div class="col">
                                <input type="text" id="description" placeholder="Description"
                                    formControlName="description" i18n-placeholder>
                            </div>
                        </div>
                        <div class="row m-2">
                            <div class="col text-end">
                                <label for="comment" class="fw-bold" i18n>Comment:</label>
                            </div>
                            <div class="col">
                                <input type="email" id="comment" placeholder="Comment" formControlName="comment" i18n-placeholder>
                            </div>
                        </div>
                        <div class="row m-2">
                            <div class="col text-end">
                                <label for="licenseType" class="fw-bold" i18n>License type:</label>
                            </div>
                            <div class="col">
                                <input type="text" id="licenseType" placeholder="License type"
                                    formControlName="licenseType" i18n-placeholder>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" i18n>Cancel</button>
                <button type="submit" class="btn btn-primary"
                    (click)="manage.emit({entity:formGroup.value, organization:organization, operation:operation, closeElement:closeButton})"
                    i18n>Save</button>
            </div>
        </div>
    </div>
</div>
