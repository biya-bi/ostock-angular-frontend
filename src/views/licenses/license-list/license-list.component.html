<div class="container d-flex justify-content-center">
    <div class="row justify-content-center">
        <div class="col">
            <a href="#" data-bs-toggle="modal" data-bs-target="#writeLicenseModal" (click)="selectedLicense=null;mode=WriteMode.Create;crudTitle='Add a license'">Add a license</a>

            <ng-container *ngIf="entities?.length; else emptyLicenseTemplate">
                <p class="mt-2 fw-bold">Below is the list of available licenses:</p>

                <ul *ngFor="let entity of entities">
                    <li>
                        <a href="#" data-bs-toggle="modal" data-bs-target="#writeLicenseModal"
                            (click)="selectedLicense=entity;mode=WriteMode.Update;crudTitle='Edit license'">{{entity.productName}}</a>
                    </li>
                </ul>
            </ng-container>

            <ng-template #emptyLicenseTemplate>
                <p>You haven't added any license yet.</p>
            </ng-template>
        </div>
    </div>
</div>
<app-license-write [entity]="selectedLicense" (save)="save.emit($event)" [organization]="organization" [mode]="mode" [title]="crudTitle"></app-license-write>
