<div class="d-flex" *ngIf="{userProfile: userProfile$ | async, 
	isLoginPage: isLoginPage$ | async} as data">
	<button class="d-md-none items-align-center" type="button" data-bs-toggle="collapse"
		data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation"
		*ngIf="!data.isLoginPage">
		<span class="material-icons">menu</span>
	</button>
	<ng-container class="" *ngIf="!data.isLoginPage">
		<app-authentication-toggle class="d-md-none" [userProfile]="data.userProfile" />
		<app-authentication-toggle class="ms-2 d-none d-md-inline" [userProfile]="data.userProfile" />
	</ng-container>
</div>
