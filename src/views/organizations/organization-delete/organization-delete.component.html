<div class="modal fade" id="deleteOrganizationModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="title" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="title" i18n>Delete organization</h1>
                <button #closeButton type="button" class="btn-close" data-bs-dismiss="modal"
                    aria-label="Close" i18n-aria-label></button>
            </div>
            <div class="modal-body" i18n>
                Are you sure you want to delete this organization?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" i18n>Cancel</button>
                <button type="button" class="btn btn-danger"
                    (click)="manage.emit({entity:entity,operation:Operation.Delete,closeElement:closeButton})" i18n>Delete</button>
            </div>
        </div>
    </div>
</div>
