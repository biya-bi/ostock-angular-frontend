<h1 class="d-flex justify-content-center mb-4">Organizations</h1>
<div class="container d-flex justify-content-center">
    <div class="row justify-content-center">
        <div class="col">
            <a routerLink="/organizations/add" [queryParams]="{mode:WriteMode.Create}">Add an organization</a>

            <ng-container *ngIf="entities?.length; else emptyOrganizationTemplate">
                <p class="mt-2 fw-bold">Below is the list of available organizations:</p>

                <ul *ngFor="let entity of entities">
                    <li>
                        <a routerLink="/organizations/details"
                            [queryParams]="{uri:entity._links.self.href,mode:WriteMode.Read}">{{entity.name}}</a>
                    </li>
                </ul>
            </ng-container>

            <ng-template #emptyOrganizationTemplate>
                <p>You haven't added any organization yet.</p>
            </ng-template>
        </div>
    </div>
</div>
