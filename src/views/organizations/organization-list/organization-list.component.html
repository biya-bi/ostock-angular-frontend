<h1 class="d-flex justify-content-center mb-4" i18n>Organizations</h1>
<div class="container d-flex justify-content-center">
    <div class="row justify-content-center">
        <div class="col">
            <div class="d-flex">
                <a routerLink="/organizations/add" [queryParams]="{operation:Operation.Create}" i18n>Add an organization</a>
                <span class="ms-3" *ngIf="busy" i18n>Loading...</span>
            </div>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col" sortable="name" (sort)="sort.emit($event)" i18n> Name </th>
                        <th scope="col" sortable="contactName" (sort)="sort.emit($event)" i18n> Contact Name </th>
                        <th scope="col" sortable="contactEmail" (sort)="sort.emit($event)" i18n> Contact Email </th>
                        <th scope="col" sortable="contactPhone" (sort)="sort.emit($event)" i18n> Contact Phone </th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <input class="form-control" type="text" name="name" [(ngModel)]="searchCriteria.name"
                                (keyup)="search.emit(searchCriteria)" />
                        </td>
                        <td>
                            <input class="form-control" type="text" name="contactName"
                                [(ngModel)]="searchCriteria.contactName" (keyup)="search.emit(searchCriteria)" />
                        </td>
                        <td>
                            <input class="form-control" type="text" name="contactEmail"
                                [(ngModel)]="searchCriteria.contactEmail" (keyup)="search.emit(searchCriteria)" />
                        </td>
                        <td>
                            <input class="form-control" type="text" name="contactPhone"
                                [(ngModel)]="searchCriteria.contactPhone" (keyup)="search.emit(searchCriteria)" />
                        </td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <ng-container *ngIf="entities?.length">
                        <tr *ngFor="let entity of entities">
                            <td><ngb-highlight [result]="entity.name" [term]="searchCriteria.name"></ngb-highlight></td>
                            <td><ngb-highlight [result]="entity.contactName"
                                    [term]="searchCriteria.contactName"></ngb-highlight></td>
                            <td><ngb-highlight [result]="entity.contactEmail"
                                    [term]="searchCriteria.contactEmail"></ngb-highlight></td>
                            <td><ngb-highlight [result]="entity.contactPhone"
                                    [term]="searchCriteria.contactPhone"></ngb-highlight></td>
                            <td>
                                <a routerLink="/organizations/details"
                                    [queryParams]="{uri:entity._links.self.href,operation:Operation.Read}" i18n>Details
                                </a>
                            </td>
                            <td><a routerLink="/organizations/edit"
                                    [queryParams]="{uri:entity._links.self.href,operation:Operation.Update}" i18n>Edit</a>
                            </td>
                            <td>
                                <a href="#" data-bs-toggle="modal" data-bs-target="#deleteOrganizationModal"
                                    class="link-danger" (click)="selectedEntity=entity" i18n>Delete
                                </a>
                            </td>
                        </tr>
                    </ng-container>
                </tbody>
            </table>

            <div class="d-flex justify-content-between p-2" *ngIf="entities?.length">
                <ngb-pagination [collectionSize]="page.totalElements" [(page)]="page.request.pageNumber"
                    [pageSize]="page.request.pageSize" (pageChange)="pageChange.emit($event)">
                </ngb-pagination>

                <select class="form-select form-select-sm w-auto" name="pageSize" [(ngModel)]="page.request.pageSize"
                    (change)="search.emit(searchCriteria)">
                    <option [ngValue]="20" i18n>20 items per page</option>
                    <option [ngValue]="40" i18n>40 items per page</option>
                    <option [ngValue]="60" i18n>60 items per page</option>
                </select>
            </div>

            <p *ngIf="!entities?.length" i18n>No record to display</p>

            <app-organization-delete (manage)="manage.emit($event)" [entity]="selectedEntity"></app-organization-delete>
        </div>
    </div>
</div>
